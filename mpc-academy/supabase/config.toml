# Minimal Supabase CLI config. Adjust project_id after `supabase init` if needed.
# This does NOT contain secrets. Real keys live in .env.local (never committed).
project_id = "mpc-academy-v2"

[db]
# Local dev database port used by `supabase start`.
port = 54322

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
